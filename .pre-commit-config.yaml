repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty
        entry: uv run ty check src/ignition/core
        language: system
        pass_filenames: false
        types: [python]

      - id: no-ai-attribution
        name: reject AI/co-author attributions in commit message
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
