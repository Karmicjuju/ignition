schema_version: 1
key: helm
name: Helm
description: Package manager for Kubernetes
categories: [container, orchestration]
persona_tags: [devops]
managed: false
version_policy: flexible
requires_sudo: false
health_check: "helm version"
dependencies: []

install_methods:
  macos:
    - method: brew
      package: helm
      cask: false
  linux:
    - method: script
      url: "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3"
